name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.29.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Instalar dependências
        run: corepack pnpm install --frozen-lockfile
      - name: Conferir tipos gerados pelos schemas
        run: corepack pnpm schemas:check
      - name: Verificar TypeScript
        run: corepack pnpm check
      - name: Executar testes unitários
        run: corepack pnpm test
      - name: Verificar lint
        run: corepack pnpm lint
      - name: Compilar frontend
        run: corepack pnpm build
      - name: Verificar formatação Rust
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Verificar Rust
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: Testar persistência, migração e imagens
        working-directory: src-tauri
        run: cargo test
      - name: Compilar núcleo Tauri
        working-directory: src-tauri
        run: cargo check
      - name: Gerar instalador Windows NSIS
        run: corepack pnpm tauri:build
      - name: Disponibilizar instalador para teste
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows-${{ github.run_number }}-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
